<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>발주서 자동 변환기</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1>발주서 자동 변환기</h1>
    <span class="version" id="appVersion"></span>
  </header>

  <main class="container">
    <p class="lead">스마트스토어·쿠팡 주문 엑셀을 올리면 <strong>당일발주</strong> 양식 엑셀로 변환합니다.</p>

    <section class="card" id="step-upload">
      <h2>1. 주문 파일 업로드</h2>
      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept=".xlsx,.xls,.csv" multiple hidden>
        <span>파일을 끌어다 놓거나 클릭해서 선택하세요 (.xlsx, .xls, .csv)</span>
      </label>
      <ul class="file-list" id="fileList"></ul>
    </section>

    <section class="card" id="step-preview" hidden>
      <h2>2. 변환 결과 미리보기</h2>
      <p id="summary"></p>
      <div class="table-wrap">
        <table id="previewTable">
          <thead><tr><th>수취자명</th><th>구입품목</th><th>수량</th><th>전화번호</th><th>주소</th><th>배송메세지</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="card" id="step-download" hidden>
      <h2>3. 엑셀 다운로드</h2>
      <button id="downloadBtn" class="btn">당일발주 엑셀 다운로드</button>
      <button id="resetBtn" class="btn secondary">초기화</button>
    </section>
  </main>

  <script src="vendor/xlsx.full.min.js"></script>
  <script src="vendor/exceljs.min.js"></script>
  <script src="js/parser.js"></script>
  <script src="js/exporter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
